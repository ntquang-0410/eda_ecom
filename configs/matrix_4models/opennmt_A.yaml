data:
  corpus_1:
    path_src: onmt/A/train.vi
    path_tgt: onmt/A/train.zh
    weight: 1
  valid:
    path_src: onmt/A/valid.vi
    path_tgt: onmt/A/valid.zh
save_model: onmt/A/model
src_vocab: onmt/A/vocab.vi
tgt_vocab: onmt/A/vocab.zh
