<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; margin: 12px; color: #1d2733; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; margin: 8px 0 2px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #9aa7b4; border-radius: 5px; font: inherit; }
  .hang { display: flex; gap: 8px; margin-top: 10px; }
  button { padding: 5px 10px; border: 1px solid #1f6f5c; background: #1f6f5c; color: #fff; border-radius: 5px; cursor: pointer; font: inherit; }
  button.phu { background: #fff; color: #1f6f5c; }
  #den { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #9aa7b4; margin-right: 6px; vertical-align: middle; }
  #tt { margin-top: 10px; min-height: 2.6em; word-break: break-word; }
  .nho { color: #5d6b79; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Dịch 1688 sang tiếng Việt (demo)</h1>
  <label for="may_chu">Địa chỉ máy chủ dịch</label>
  <input id="may_chu" placeholder="http://127.0.0.1:8765" spellcheck="false">
  <label for="khoa">Khóa truy cập (nếu có)</label>
  <input id="khoa" type="password" placeholder="để trống khi chạy trên laptop" spellcheck="false">
  <div class="hang">
    <button id="luu">Lưu</button>
    <button id="kiem" class="phu">Kiểm tra máy chủ</button>
  </div>
  <div id="tt"><span id="den"></span><span id="chu">Chưa kiểm tra.</span></div>
  <div class="nho">Mở trang chi tiết sản phẩm 1688, bấm nút “Dịch sang tiếng Việt” ở góc phải dưới.</div>
  <script src="popup.js"></script>
</body>
</html>
